server.port=8080
spring.datasource.url=${ORDEN_DB_URL}
spring.datasource.username=${ORDEN_DB_USER}
spring.datasource.password=${ORDEN_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOCAL_JWT_JWK_SET_URI:}
spring.security.oauth2.resourceserver.jwt.tenant-id=ee0d2c5b-e60b-4c57-9b30-8a38a520c430
checkout.productos-url=${PRODUCTOS_URL}
checkout.pago-url=${PAGO_URL}
checkout.pedidos-url=${PEDIDOS_URL}
checkout.service-key=${INTERNAL_SERVICE_KEY}
checkout.ttl-seconds=${QUOTE_TTL_SECONDS:900}
ms.pedidos.url=${PEDIDOS_URL}
ms.carrito.url=${CARRITO_URL:http://localhost:8080}
spring.rabbitmq.publisher-confirm-type=simple
spring.jackson.deserialization.fail-on-unknown-properties=true
