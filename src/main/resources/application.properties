spring.application.name=fazbear-orden
server.port=8084

# =============================================
# BASE DE DATOS H2 (ordenes procesadas log)
# =============================================
spring.datasource.url=jdbc:h2:mem:ordendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# =============================================
# SEGURIDAD: JWT via Azure Entra ID
# =============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/ee0d2c5b-e60b-4c57-9b30-8a38a520c430/v2.0
spring.security.oauth2.resourceserver.jwt.client-id=304fa289-2b72-447b-9c48-f00998f7c22f
logging.level.org.springframework.security=WARN

# =============================================
# RABBITMQ (CloudAMQP — rellenar al crear cuenta)
# =============================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =============================================
# URLs de otros microservicios (via API Gateway)
# =============================================
ms.carrito.url=https://1nqf3okm71.execute-api.us-east-1.amazonaws.com
ms.pedidos.url=https://1nqf3okm71.execute-api.us-east-1.amazonaws.com
