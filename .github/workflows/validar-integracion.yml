name: Validate local checkout (no publication)
on:
  push:
    branches: [ev3/integracion-integral]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ev3test
          POSTGRES_PASSWORD: ev3test
          POSTGRES_DB: ev3test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ev3test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ev3test
      TEST_DATABASE_USER: ev3test
      TEST_DATABASE_PASSWORD: ev3test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: docker build -f Dockerfile.local -t orden-local:validation .
